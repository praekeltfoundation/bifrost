name: Test

on: [push]

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check linting
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy .
      - name: Run tests
        run: uv run ./manage.py test

  synch_delivery_failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Turn app tests
        working-directory: turn_apps/synch_delivery_failures
        run: make test
      - name: Build Turn app package
        working-directory: turn_apps/synch_delivery_failures
        run: make build
