name: Publish Docker image

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

permissions:
  contents: write
  packages: write

jobs:
  push_to_registry:
    name: Build and push Docker image to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value={{branch}}-{{sha}},enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        name: Login to ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        name: Build and push image
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_synch_delivery_failures:
    name: Build Turn app package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build Turn app package
        working-directory: turn_apps/synch_delivery_failures
        run: make build

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        name: Upload Turn app release asset
        if: github.ref_type == 'tag'
        with:
          files: turn_apps/synch_delivery_failures/*.zip
